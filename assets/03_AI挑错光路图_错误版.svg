<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" width="1120" height="940" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="560" height="470" fill="#ffffff"/>

  <!-- 标题 -->
  <text x="20" y="34" font-size="22" font-weight="bold" fill="#111">AI 绘制的魔盒光路图</text>
  <text x="20" y="60" font-size="16" fill="#c0392b">⚠ 据说这幅图里藏着 两处错误 ——请你当裁判，把错误圈出来并说明依据。</text>
  <line x1="20" y1="72" x2="540" y2="72" stroke="#999" stroke-width="1"/>

  <!-- 魔盒外框 -->
  <rect x="100" y="110" width="320" height="290" fill="#fbfbfb" stroke="#333" stroke-width="2.5"/>
  <!-- 观察口（右壁开口） -->
  <rect x="418" y="160" width="6" height="120" fill="#fff" stroke="none"/>
  <rect x="416" y="160" width="10" height="120" fill="#ffffff" stroke="#ffffff" stroke-width="4"/>
  <text x="432" y="228" font-size="14" fill="#555">观察口</text>

  <!-- 45° 镜面 -->
  <line x1="120" y1="380" x2="380" y2="120" stroke="#1f4e79" stroke-width="4"/>
  <g stroke="#1f4e79" stroke-width="1.6">
    <line x1="140" y1="391" x2="150" y2="381"/>
    <line x1="170" y1="391" x2="180" y2="381"/>
    <line x1="240" y1="391" x2="250" y2="381"/>
    <line x1="290" y1="391" x2="300" y2="381"/>
  </g>
  <text x="384" y="118" font-size="15" fill="#1f4e79" font-weight="bold">45° 镜面</text>

  <!-- 物（盒底小物件） -->
  <rect x="288" y="330" width="24" height="20" fill="#e67e22" stroke="#a04000" stroke-width="2"/>
  <circle cx="300" cy="340" r="2.5" fill="#a04000"/>
  <text x="313" y="358" font-size="14" fill="#333">物 A</text>

  <!-- 像（错误位置，虚线） -->
  <rect x="253" y="140" width="24" height="20" fill="none" stroke="#8e44ad" stroke-width="2" stroke-dasharray="5 4"/>
  <circle cx="265" cy="150" r="2.5" fill="#8e44ad"/>
  <text x="196" y="134" font-size="14" fill="#8e44ad">像 A′（悬空）</text>

  <!-- 物像连线（错误：不垂直镜面，却在交点标了直角） -->
  <line x1="300" y1="340" x2="265" y2="150" stroke="#2980b9" stroke-width="2.4" stroke-dasharray="7 5"/>
  <text x="305" y="250" font-size="14" fill="#2980b9">物像连线</text>
  <!-- 交点 M(278,222) 处的假直角符号 -->
  <g stroke="#c0392b" stroke-width="2" fill="none">
    <polyline points="272,206 272,214 264,214"/>
  </g>
  <text x="238" y="204" font-size="13" fill="#c0392b">90°</text>

  <!-- 物到镜面距离 d1 -->
  <line x1="300" y1="340" x2="230" y2="270" stroke="#333" stroke-width="2"/>
  <g stroke="#333" stroke-width="1.8" fill="none">
    <polyline points="223,258 223,266 231,266"/>
  </g>
  <text x="196" y="288" font-size="14" fill="#333">d₁ = 4.0 cm</text>

  <!-- 像到镜面距离 d2（错误：明显偏短） -->
  <line x1="265" y1="150" x2="308" y2="193" stroke="#333" stroke-width="2"/>
  <g stroke="#333" stroke-width="1.8" fill="none">
    <polyline points="301,182 301,190 309,190"/>
  </g>
  <text x="312" y="176" font-size="14" fill="#333">d₂ = 2.4 cm</text>

  <!-- 眼睛与视线 -->
  <g>
    <ellipse cx="470" cy="215" rx="20" ry="12" fill="#fff" stroke="#333" stroke-width="2"/>
    <circle cx="470" cy="215" r="5" fill="#333"/>
    <text x="452" y="248" font-size="14" fill="#333">眼睛</text>
  </g>
  <line x1="450" y1="212" x2="336" y2="173" stroke="#16a085" stroke-width="2.4" marker-end="url(#arw)"/>
  <line x1="330" y1="170" x2="272" y2="153" stroke="#16a085" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="352" y="196" font-size="13" fill="#16a085">反射光线反向延长线</text>

  <defs>
    <marker id="arw" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#16a085"/>
    </marker>
  </defs>

  <!-- 图例 -->
  <g font-size="13" fill="#555">
    <rect x="20" y="410" width="520" height="46" fill="#f7f7f7" stroke="#ddd"/>
    <text x="30" y="430">提示：判断一幅镜像图对不对，可以按「等距 · 垂直 · 双标注」三查过一遍。</text>
    <text x="30" y="449">注意：图上其余部分（镜面角度、物像大小、虚线表示虚像）都是对的，错的只有两处。</text>
  </g>
</svg>
